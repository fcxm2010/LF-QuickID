[project]
name = "lf-quickid"
version = "0.1.0"
description = "Local desktop photo batch tools, starting with face grouping."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PySide6>=6.6",
  "Pillow>=10.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "opencv-python>=4.8",
  "insightface>=0.7",
  "onnxruntime>=1.16",
  "rembg>=2.0",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
lf-quickid = "lf_quickid.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
